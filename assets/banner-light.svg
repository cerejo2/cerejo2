<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="t d">
  <title id="t">|Rodrigo Cerejo⟩ = α|estudante⟩ + β|programador⟩</title>
  <desc id="d">Um qubit numa esfera de Bloch, entre estudante e programador, que é medido no fim de um circuito de competências.</desc>
  <style>
    .ink   { fill: #141418; }
    .ink2  { fill: #3d3d46; }
    .mute  { fill: #76726a; }
    .acc   { fill: #d01e44; }
    .s-ink { stroke: #141418; fill: none; }
    .s-mut { stroke: #a9a399; fill: none; }
    .s-acc { stroke: #d01e44; fill: none; }
    .gate  { fill: #ffffff; stroke: #141418; stroke-width: 1.2; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }

    /* ciclo de 9 s: o impulso percorre o circuito, o medidor dispara, o estado colapsa, volta a preparar-se */
    .pulse  { animation: run 9s linear infinite; }
    .needle { animation: tick 9s ease-in-out infinite; }
    .state  { animation: collapse 9s cubic-bezier(.3, 1.4, .5, 1) infinite; }
    .south  { animation: hit 9s linear infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }

    @keyframes run {
      0%   { transform: translateX(0); opacity: 0; }
      4%   { opacity: 1; }
      50%  { transform: translateX(760px); opacity: 1; }
      53%, 100% { transform: translateX(760px); opacity: 0; }
    }
    @keyframes tick {
      0%, 50%  { transform: rotate(0deg); }
      55%, 86% { transform: rotate(-64deg); }
      92%, 100% { transform: rotate(0deg); }
    }
    @keyframes collapse {
      0%, 52%  { transform: rotate(-47deg) scaleY(.925); }
      58%, 86% { transform: rotate(0deg) scaleY(1); }
      93%, 100% { transform: rotate(-47deg) scaleY(.925); }
    }
    @keyframes hit {
      0%, 55%  { fill: #3d3d46; }
      58%, 86% { fill: #d01e44; }
      92%, 100% { fill: #3d3d46; }
    }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .needle, .state, .south, .cursor { animation: none; }
    }
  </style>

  <!-- |Rodrigo Cerejo⟩ -->
  <line class="s-acc" x1="14" y1="22" x2="14" y2="100" stroke-width="3"/>
  <text class="ink serif" x="30" y="86" font-size="70" textLength="452" lengthAdjust="spacingAndGlyphs">Rodrigo <tspan font-style="italic">Cerejo</tspan></text>
  <polyline class="s-acc" points="498,22 524,61 498,100" stroke-width="3" stroke-linejoin="miter"/>

  <!-- superposição -->
  <text class="ink2 mono" x="16" y="136" font-size="17">= <tspan class="acc">α</tspan>|estudante&gt; + <tspan class="acc">β</tspan>|programador&gt;<tspan class="acc cursor"> _</tspan></text>
  <text class="mute sans" x="16" y="164" font-size="14.5">Engenharia Informática · Universidade de Aveiro</text>

  <!-- esfera de Bloch -->
  <g transform="translate(738 100)">
    <text class="ink2 mono" x="0" y="-74" font-size="12.5" text-anchor="middle">|estudante&gt;</text>
    <text class="south mono" x="0" y="84" font-size="12.5" text-anchor="middle" fill="#3d3d46">|programador&gt;</text>
    <path class="s-mut" d="M-58 0 A58 16 0 0 1 58 0" stroke-width="1" stroke-dasharray="3 3"/>
    <line class="s-mut" x1="0" y1="-66" x2="0" y2="66" stroke-width="1" stroke-dasharray="3 3"/>
    <circle class="s-ink" cx="0" cy="0" r="58" stroke-width="1.3"/>
    <path class="s-ink" d="M58 0 A58 16 0 0 1 -58 0" stroke-width="1"/>
    <circle class="ink" cx="0" cy="-58" r="2.2"/>
    <circle class="ink" cx="0" cy="58" r="2.2"/>
    <g class="state">
      <line class="s-acc" x1="0" y1="0" x2="0" y2="58" stroke-width="2.4" stroke-linecap="round"/>
      <circle class="acc" cx="0" cy="58" r="4.4"/>
    </g>
  </g>

  <!-- circuito de competências -->
  <line class="s-ink" x1="14" y1="216" x2="790" y2="216" stroke-width="1.2"/>
  <g transform="translate(22 216)"><circle class="acc pulse" cx="0" cy="0" r="5"/></g>

  <g class="sans" font-size="12.5" font-weight="600" text-anchor="middle">
    <rect class="gate" x="46"  y="203" width="70" height="26" rx="5"/><text class="ink" x="81"  y="220.5">Python</text>
    <rect class="gate" x="146" y="203" width="56" height="26" rx="5"/><text class="ink" x="174" y="220.5">Java</text>
    <rect class="gate" x="232" y="203" width="40" height="26" rx="5"/><text class="ink" x="252" y="220.5">C</text>
    <rect class="gate" x="302" y="203" width="52" height="26" rx="5"/><text class="ink" x="328" y="220.5">SQL</text>
    <rect class="gate" x="384" y="203" width="92" height="26" rx="5"/><text class="ink" x="430" y="220.5">TypeScript</text>
    <rect class="gate" x="506" y="203" width="48" height="26" rx="5"/><text class="ink" x="530" y="220.5">Git</text>
    <rect class="gate" x="584" y="203" width="58" height="26" rx="5"/><text class="ink" x="613" y="220.5">Bash</text>
  </g>

  <!-- medição: o estágio -->
  <rect x="762" y="198" width="44" height="36" rx="6" fill="#ffffff" stroke="#d01e44" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path class="s-acc" d="M772 226 A12 12 0 0 1 796 226" stroke-width="1.8" stroke-linecap="round"/>
  <g transform="translate(784 226)"><line class="s-acc needle" x1="0" y1="0" x2="8" y2="-13" stroke-width="1.8" stroke-linecap="round"/></g>
  <line class="s-acc" x1="806" y1="214" x2="866" y2="214" stroke-width="1"/>
  <line class="s-acc" x1="806" y1="218" x2="866" y2="218" stroke-width="1"/>
  <text class="acc mono" x="836" y="206" font-size="11" text-anchor="middle">estágio</text>
</svg>
